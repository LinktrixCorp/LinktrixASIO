[workspace]
members = ["crates/linktrix-asio", "crates/wat-asio", "crates/linktrix-asio-host", "crates/linktrix-bus"]
resolver = "2"

[workspace.package]
version = "0.30.1"
edition = "2021"
publish = false
authors = ["Linktrix"]

[workspace.dependencies]
anyhow = "1"
# Same feature set as the Linktrix Tools workspace the shipped binaries were built in.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_Media_Audio", "Win32_Devices_Enumeration_Pnp", "Win32_Devices_Properties", "Win32_Devices_DeviceAndDriverInstallation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
